services:
  - type: web
    name: campusarena-web
    runtime: docker
    region: singapore
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health/
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: campusarena-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: gdgProject.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusarena-db
          property: connectionString
      - key: RENDER_POSTGRES_REGION
        value: singapore
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campusarena-cache
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: AUTO_SEED_DEMO_DATA
        value: "true"
      - key: SITE_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_API_URL
        value: https://api.resend.com/emails
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: keyvalue
    name: campusarena-cache
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  - name: campusarena-db
    region: singapore
    plan: basic-1gb
    databaseName: campusarena
    user: campusarena
    ipAllowList: []
